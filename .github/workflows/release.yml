name: Release wheel

# Build the sdist + wheel on every version tag and attach them to that tag's
# GitHub Release. GitHub Packages has no Python (PyPI) registry, so the Release
# assets ARE the published, pip-installable artifacts:
#   pip install https://github.com/nabievuz/daslab/releases/download/vX.Y.Z/daslab-X.Y.Z-py3-none-any.whl
#
# The release is created if it does not exist yet, so this works whether the tag
# is pushed before or after the manual `gh release create` step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create/edit the Release and upload assets

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: Verify the wheel version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          whl=$(ls dist/*.whl)
          case "$whl" in
            dist/daslab-"$tag"-*) echo "OK: $whl matches tag v$tag" ;;
            *) echo "::error::wheel $whl does not match tag v$tag (VERSION out of sync?)"; exit 1 ;;
          esac

      - name: Attach artifacts to the GitHub Release (create if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber
