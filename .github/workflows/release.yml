name: Release wheel


on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist

      - name: Verify the wheel version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          whl=$(ls dist/*.whl)
          case "$whl" in
            dist/daslab-"$tag"-*) echo "OK: $whl matches tag v$tag" ;;
            *) echo "::error::wheel $whl does not match tag v$tag (VERSION out of sync?)"; exit 1 ;;
          esac

      - name: Attach artifacts to the GitHub Release (create if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.whl dist/*.tar.gz --clobber
