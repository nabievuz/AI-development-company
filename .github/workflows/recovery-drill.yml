name: Recovery drill (T5, scheduled)


on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of kill-drill iterations (>= 20)"
        required: false
        default: "50"

permissions:
  contents: read

jobs:
  recovery-drill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Kill/fork recovery drill — expensive tier (>= 20 iterations)
        run: python3 scripts/kill_drill.py --iterations "${ITERATIONS:-50}"
        env:
          ITERATIONS: ${{ github.event.inputs.iterations }}
