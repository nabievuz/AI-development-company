name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install dev dependencies (hash-pinned — P13 / OSSF Pinned-Dependencies)
        run: |
          python -m pip install --upgrade pip
          grep -q -- '--hash=sha256' requirements-dev.txt   # guard: the lockfile MUST be hashed
          pip install --require-hashes -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check scripts tests

      - name: Compile all tracked Python
        run: python -m py_compile $(git ls-files '*.py')

      - name: Board lint
        run: python3 scripts/board_lint.py

      - name: Agents in sync
        run: python3 scripts/gen_subagents.py && python3 scripts/check_agents_sync.py

      - name: Gate order
        run: python3 scripts/check_gates.py

      - name: No hardcoded paths (LAW A — self-locating root)
        run: python3 scripts/check_no_hardcoded_paths.py

      - name: Project isolation (LAW C — project-agnostic engine)
        run: python3 scripts/check_project_isolation.py

      - name: No dead runtime (no dead legacy :3100 endpoint)
        run: python3 scripts/check_no_dead_runtime.py

      - name: Precedence enforced (no charter/overlay relaxes a board rule)
        run: python3 scripts/check_precedence.py

      - name: CODEOWNERS complete + in sync
        run: python3 scripts/check_codeowners.py

      - name: Quickstart works on a fresh clone
        run: |
          set +e
          python3 scripts/check_quickstart.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "quickstart: verified"; exit 0; fi
          if [ "$rc" -eq 3 ]; then echo "quickstart: NO DATA — no README Quickstart in tree; nothing was verified"; exit 0; fi
          exit "$rc"

      - name: Link integrity (blocking)
        run: python3 scripts/check_links.py

      - name: Code-only law — no comments or docstrings in source
        run: python3 scripts/check_no_prose.py

      - name: Feature flags match their code declaration (D14)
        run: python3 scripts/check_feature_flags.py

      - name: Wave ledger is verifiable evidence (D11)
        run: python3 scripts/check_ledger.py --wave-ledger

      - name: T7 quality rubric intact (immutable hard blocker — R-3)
        run: python3 scripts/check_t7_quality.py
      - name: T1 busy-fraction gate (R-1)
        run: python3 scripts/check_busy_fraction.py
      - name: Never-auto-approve / QONUN-5 (R-4)
        run: python3 scripts/check_never_auto_approve.py --board board --config config/risk_taxonomy.yaml
      - name: Clarify gate / Definition-of-Ready (ADR-0014, fail-closed — ADR-0013 ratified 2026-06-26)
        run: python3 scripts/check_clarifications.py --strict
      - name: Approved-goal-queue integrity / QONUN-3 (ADR-0014)
        run: python3 scripts/check_approved_goal_queue.py
      - name: SPEC.md consistency / Phase 2 (ADR-0015, dormant until a SPEC exists)
        run: python3 scripts/check_spec_consistency.py
      - name: Ticket dependency graph / Phase 3 (ADR-0016, acyclic + no dangling deps)
        run: python3 scripts/check_dependency_graph.py
      - name: Role-overlay contract / P3 (ADR-0018, strict — Mission/Scope/DoD/Escalation)
        run: python3 scripts/check_overlay_sections.py --strict
      - name: Gate promotion status / P1b (ADR-0020, informational — unmeasured is SKIPPED, not green)
        run: |
          set +e
          python3 scripts/gate_promotion.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then exit 0; fi
          exit "$rc"

      - name: GATE-6 evidence record, max_quality_drop 0 (R-2)
        run: python3 scripts/check_gate6_record.py --events board/.events.jsonl --experiments experiments
      - name: BREAK-GLASS 24h post-incident review (R-8)
        run: python3 scripts/check_break_glass_review.py
      - name: Self-optimizing loop stays off / shadow (RFC-001)
        run: python3 scripts/check_loop_mode.py

      - name: Org Schema in sync — generated constants + never-auto-approve (R-12)
        run: python3 scripts/check_org_drift.py
      - name: ArcRift migration upgrade()+downgrade() shadow validation (R-13)
        run: python3 -m pytest tests/test_arcrift_migration.py -q

      - name: T2 idle-wave rate (R-1)
        run: python3 scripts/check_idle_waves.py
      - name: T3 effective concurrency (R-1)
        run: python3 scripts/check_concurrency.py
      - name: T4 cost/model-mix (R-1)
        run: python3 scripts/check_model_mix.py
      - name: T5 recovery reliability — inert-by-design shadow check (R-1)
        run: python3 scripts/check_recovery.py
      - name: T6 review efficiency (R-1)
        run: python3 scripts/check_review_eff.py
      - name: Anti-gaming + T1b (R-9)
        run: python3 scripts/check_metric_gaming.py
      - name: GATE-6 cryptographic attestation (R-2 / ADR-0003)
        run: python3 scripts/check_gate6_attestation.py
      - name: Wave-attestation completeness + hash-chain (GATE-4 / ADR-0031 / DAS-1500)
        run: python3 scripts/check_attestation.py
      - name: Wave reconciliation — ledger ⇄ attestation bijection + chain + coverage (GATE-4 / ADR-0032 / DAS-1506)
        run: python3 scripts/check_wave_reconciliation.py

      - name: Clean-room import-ban gate — no donor libraries (§2 clean-room / F-5)
        run: python3 scripts/check_import_ban.py
      - name: Communication-flows closed-graph gate (ADR-0026)
        run: python3 scripts/check_comm_flows.py
      - name: Communication-flows shape + derivation gate (ADR-0026 / DAS-1465 / F-5)
        run: python3 scripts/validate_commflows.py
      - name: DGO-X span coverage + well-formedness gate (DAS-1456)
        run: python3 scripts/check_spans.py
      - name: C1 cost-ledger gate (ORGANISM WS3 P12 / DAS-1459)
        run: python3 scripts/check_cost.py
      - name: Progress-ledger schema gate (P7 / DAS-1470)
        run: |
          shopt -s nullglob
          found=0
          for led in board/runs/*/progress-ledger.json; do
            found=1
            python3 scripts/check_ledger.py --path "$led"
          done
          if [ "$found" -eq 0 ]; then
            echo "check_ledger: no board/runs/*/progress-ledger.json present — inert pass (no run ledgers to validate)"
          fi
      - name: Golden-eval competence gate — REAL teeth (a role below 0.80 fails CI)
        run: python3 scripts/agent_eval.py --all --enforce
      - name: Golden-eval anti-gaming gate — empty-probe + task.md answer-key leak (DAS-1536 / F-5)
        run: python3 scripts/agent_eval.py --check-gaming

      - name: ArcRift memory governance (R-5)
        run: python3 scripts/check_memory_governance.py
      - name: Secrets never in prompts/runtime (R-6)
        run: python3 scripts/check_secrets.py
      - name: Least-privilege per agent (R-6)
        run: python3 scripts/check_permissions.py
      - name: Prompt-injection guard (R-6)
        run: python3 scripts/check_injection_guard.py
      - name: Operator cockpit renders (R-7, smoke)
        run: python3 scripts/cockpit.py > /dev/null && python3 scripts/cockpit.py --glossary > /dev/null

      - name: Replay-QA recovery drills (T5 / RFC-003)
        run: python3 scripts/replay_qa.py
      - name: T5 kill-drill (real crash+resume) — real T5 teeth (DAS-1451)
        run: python3 scripts/kill_drill.py --smoke
      - name: Kill-switch / safety-rail drill — cheap smoke (WS4 SI-2..SI-7 / DAS-1478)
        run: python3 scripts/kill_switch_drill.py --smoke
      - name: Operator trust tools render (R10/R11/R15, smoke)
        run: |
          echo '{"ticket_type":"feature","stage":"GATE-3","paths":["src/x.py"]}' > "${RUNNER_TEMP:-/tmp}/intent_smoke.json"
          python3 scripts/intent_preview.py --plan-file "${RUNNER_TEMP:-/tmp}/intent_smoke.json" > /dev/null   # R10
          python3 scripts/approval_digest.py > /dev/null                                                       # R11
          python3 scripts/escalation_context.py --ticket DAS-SMOKE-NONEXISTENT > /dev/null                     # R15

      - name: Blind review + rotation (T6 anti-drift)
        run: python3 scripts/check_blind_review.py
      - name: P5 advanced tools render (R16/R20/R21, smoke)
        run: |
          set +e
          python3 scripts/alerting.py > /dev/null; alerting_rc=$?
          python3 scripts/trends.py > /dev/null; trends_rc=$?
          python3 scripts/adaptive_taxonomy.py > /dev/null; taxonomy_rc=$?
          set -e
          echo "alerting=$alerting_rc trends=$trends_rc adaptive_taxonomy=$taxonomy_rc (0 healthy, 1 degraded, 3 no-data)"
          for rc in "$alerting_rc" "$trends_rc" "$taxonomy_rc"; do
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
          done

      - name: Loop promotion controller (RFC-001 §5, smoke)
        run: python3 scripts/loop_controller.py > /dev/null

      - name: Install WS-H control-plane test deps (scoped; makes the FastAPI endpoint tests run)
        run: |
          python -m pip install -r tools/control_plane/requirements-control.txt httpx

      - name: Tests
        run: python -m pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          NODE_OPTIONS: "--disable-warning=DEP0040 --disable-warning=DEP0169"

  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (the fresh-clone boot needs PyYAML)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
      - name: Clone to a different path (simulate another machine) and boot
        run: |
          dest="${RUNNER_TEMP}/machine-b"
          git clone . "$dest"
          cd "$dest"
          python3 scripts/bootstrap.py                 # idempotent first-run setup (creates projects/)
          python3 scripts/doctor.py                    # exit 0 on a bare runner: REQUIRED pass, ArcRift/Ollama=WARN
          python3 scripts/gen_subagents.py && git diff --exit-code   # zero drift: .claude/agents + ROUTING
          python3 scripts/check_no_hardcoded_paths.py
          python3 scripts/check_project_isolation.py
          python3 scripts/check_no_dead_runtime.py
          python3 scripts/check_codeowners.py
          python3 scripts/board_lint.py
          python3 scripts/check_links.py

  release-gate:
    runs-on: ubuntu-latest
    needs: [validate, secret-scan, portability]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install dev dependencies (diagnostics runs ruff + needs PyYAML)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
      - name: Diagnostics — must print SCORE = 100/100
        run: python3 scripts/diagnostics.py
