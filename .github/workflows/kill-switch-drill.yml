name: Kill-switch drill (WS4 safety rails, scheduled)


on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of full drill passes (>= 20)"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  kill-switch-drill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Kill-switch + safety-rail drill — expensive tier (>= 20 passes)
        run: python3 scripts/kill_switch_drill.py --iterations "${ITERATIONS:-30}"
        env:
          ITERATIONS: ${{ github.event.inputs.iterations }}
