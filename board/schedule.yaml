
version: 1

max_concurrent_waves: 1
never_auto_approve: true

quiet_hours:
  start: "22:00"
  end: "06:00"
  timezone: UTC

triggers:

  - name: cron_tick
    description: >
      Time-based periodic tick from the Founder-owned OS scheduler entry
      (launchd/cron). Dispatches pending board work, else runs a validate
      checkpoint if due, else idles. The cadence (interval) lives entirely
      in the OS scheduler entry — never inside this process (SI-1).
    enabled: true
    notes: >
      The OS scheduler entry is DOCUMENTED BELOW (not installed). Enabling
      the cron_tick trigger requires the Founder to install the entry and
      flip heartbeat_enabled: true in config/features.yaml.

  - name: after_n_runs
    description: >
      Every N completed runs → a periodic validate checkpoint to confirm
      the board state is healthy, without a full dispatch.
    checkpoint_every: 10
    enabled: true

  - name: ticket_created
    description: >
      A new ticket appeared on the board → consider dispatching the next wave.
      The flow_router still applies all safety gates (SI-3..SI-6) before
      returning dispatch; quiet hours or break-glass may idle this tick.
    enabled: true

  - name: wave_completed
    description: >
      A wave just finished (run_end event) → run validators to confirm health,
      then decide the next tick. Always safe (validate is read-only).
    enabled: true

  - name: interrupt_answered
    description: >
      A human wrote resume:<value> on an interrupted ticket → dispatch to
      resume the parked work. The router NEVER auto-answers; it dispatches
      only because the trigger itself signals a human already supplied the
      resume: value (SI-7).
    enabled: true

scheduled_jobs:
  - name: memory_consolidation
    description: >
      Sleep-time memory consolidation: apply the composite recall ranking to
      board/.arcrift-outbox.jsonl, report prune-hygiene candidates and A/B
      ranking parity. READ-ONLY — never prunes or stores (pruning is a
      Founder-gated ArcRift act).
    command: "python3 scripts/consolidate_memory.py --out board/runs/consolidation/latest.json"
    cadence: idle
    read_only: true
    installed: false
