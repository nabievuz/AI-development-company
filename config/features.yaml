# Latent-machine feature flags (ADR-0019, remediation P10).
#
# Default OFF: consumerless machinery does not emit or run until a real consumer
# exists, so the idle DGO-X shadow + T4/T7 governors do not burn tokens every wave
# (atom-audit P10). Flip a flag to true once its consumer is live.
#
# Read via scripts/feature_flags.py (enabled("<flag>")).

dgox_emit: false        # /daslab-cycle step 5d routing_decision shadow emission (ADR-0011 Phase-1, no Phase-2 consumer yet)
t4_t7_governors: false  # T4 cost/model-mix + T7 quality governor invocations during a wave
organism_emit: true     # ACTIVATED 2026-07-03 (Founder-authorized): consumers now live (dispatch_emitter, cost_ledger, check_spans, snapshot_evidence). /daslab-cycle ORGANISM WS1 "pulse" run-model: run-open + wave checkpoints (pulse_checkpoint) + run_start/run_end/span emission (dispatch_emitter) at steps 0/5/6; SEPARATE channel from dgox_emit; post-decision, failure-isolated (flag-on == flag-off dispatch)
heartbeat_enabled: false  # WS4 HEARTBEAT (ADR-0027 SI-7): default OFF. Flip to true ONLY after a >=3-day clean shadow window; Founder-only act (QONUN-5). Consumed by scripts/loop_controller.py --tick.

# ---------------------------------------------------------------------------
# MUSTAQIL workstream flags (DAS-1543 / ADR-0019, all DEFAULT OFF).
# Each stays false until its workstream's consumer is live AND its AADL gate is
# closed; flipping is a Founder-only act once the flip condition is met. WS-F
# (HEARTBEAT) reuses the existing `heartbeat_enabled` above — NOT duplicated here.
# ---------------------------------------------------------------------------
ws_a_tool_bridge: true       # ACTIVATED 2026-07-26 (Founder-authorized): WS-A ecosystem tool/MCP bridge (ADR-0033) live. Bridge + deny-all/allow-list egress (Q5) landed; PreToolUse hook (audit_external_tool.py) enforces the compiled board/.tool-allowlist.json (wired via DASLAB_TOOL_ALLOWLIST in .claude/settings.json). Core infra MCPs (ArcRift/obsidian) carved out so the Persistent Memory Law is never denied; ecosystem bridges governed per role; ungranted + unidentified fail-closed deny.
ws_b_agent_sdk_runner: false # WS-B headless Agent SDK runner (ADR-0034, daslab_sdk). Consumer: the subscription-Claude dispatch path. Flip when the runner authenticates via Claude account/OAuth and the ADR-0009 admission layer wraps it.
ws_c_langgraph_loop: false   # WS-C LangGraph/DGO-X execution substrate (ADR-0035). Consumer: the finisher loop. Flip when the loop runs a real 0->100 slice under supervision (Q4).
ws_d_langfuse_lens: true     # ACTIVATED 2026-07-26 (Founder-authorized): self-host Langfuse v3 (ADR-0036) deployed in-tenant on the tenant box (docker compose, loopback 127.0.0.1:3000; OTLP /api/public/otel/v1/traces verified HTTP 200). WS-D read-side exporter (tools/observability/otlp_exporter.py) is now live: replays committed DGO-X spans → redact (ADR-0012) → OTLP → the loopback Langfuse lens; TN-1 boundary holds (check_in_tenant OK). Read-only, never wired into dispatch (FR-003); a lens outage is non-fatal.
ws_e_tenant_hardening: false # WS-E internal self-host hardening (ADR-0038). Consumer: tenant-VM hardening + open-weight eject-path. Flip when the internal-only boundary (Q10) is enforced end-to-end.
ws_e_openweight_ejectpath: false # WS-E vLLM/SGLang DEFERRED eject-path sub-flag (DAS-1583, design §4.2), nested under ws_e_tenant_hardening. Consumer: tools/model_gateway/ejectpath.py in-tenant route. NOT the near-term build (Q9 keeps Claude-subscription default) — flip ONLY on an explicit Founder decision to open the open-weight eject-path, and only after ws_e_tenant_hardening is already ON.
ws_g_proof: false            # WS-G end-to-end proof / attestation (ADR-0037). Consumer: the shipped-proof gate (merged + CI + deployed to VM, Q7). Flip when the first WS-H proof slice is demonstrably shipped.
ws_h_control_plane: true     # ACTIVATED 2026-07-26 (Founder-authorized): WS-H self-hosted web control plane (ADR-0039) deployed on the tenant box as a loopback-only systemd user unit (daslab-control-plane, 127.0.0.1:8899) with Founder-only RBAC (DASLAB_CP_RBAC vault). Serves requests; dispatches nothing on its own (CP-5). Access remotely via SSH tunnel / Tailscale, never a public bind.
ws_f_heartbeat: false        # WS-F HEARTBEAT alias — PLACEHOLDER ONLY. The live flag is `heartbeat_enabled` above (ADR-0027 SI-7); this key is never the flip point. Do NOT flip; flip `heartbeat_enabled` instead.
a2a_outbound: false          # A2A outbound surface (ADR-0040, extends ADR-0036 OB-1..OB-4). Consumer: the tools/ A2A endpoint that lets ANOTHER agent system call DasLab as a governed unit — a caller submits a goal PROPOSAL (board intake), NEVER a gate approval (QONUN-5). DEDICATED key, NOT a reuse of ws_d_langfuse_lens (distinct external-caller trust boundary, independent kill-switch). In-tenant only (TN-1); caller input untrusted (injection defense). Flip to true = exposing/publishing the endpoint = a Founder-only act, logged to board/.events.jsonl, and deferred until after the WS-G proof ships (Q12 go-live gate). Flag OFF ⇒ dispatch/board byte-identical to pre-merge.
