
version: 1
updated: 2026-07-24

accepted_external_roles:
  - model

endpoints:
  - name: claude_model
    role: model
    carries_code_ip: true
    url: https://api.anthropic.com
    note: accepted external exception (Q9); keep behind the ADR-0009 admission layer.

  - name: e2b_sandbox
    role: sandbox
    carries_code_ip: true
    url: http://127.0.0.1:49982
    note: code execution sandbox — must stay in-tenant.

  - name: langfuse_observability
    role: observability
    carries_code_ip: true
    url: http://127.0.0.1:3000
    note: traces/evals carry code/IP — self-hosted, in-tenant only.

  - name: audit_store
    role: audit
    carries_code_ip: true
    url: file:///var/lib/daslab/audit
    note: audit trail stays in-tenant.

  - name: arcrift_memory
    role: memory
    carries_code_ip: true
    url: stdio://local
    note: long-term memory is local; embeddings via local Ollama.

  - name: ollama_embeddings
    role: embeddings
    carries_code_ip: true
    url: http://127.0.0.1:11434
    note: embeddings run locally — Anthropic has no embeddings API.

  - name: a2a_outbound
    role: a2a
    carries_code_ip: true
    url: http://127.0.0.1:8765
    note: >-
      A2A governed edge (ADR-0040, extends ADR-0036 OB-1..OB-4) — must stay
      in-tenant (TN-1); no hosted relay/registry. Deliberately NOT added to
      accepted_external_roles (Q9's model call remains the sole exception).
