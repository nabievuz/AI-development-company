version: 1
escalation_ladder:
- ic
- lead
- cxo
- founder
precedence:
- level: 1
  key: charter
  authority: binding
  paths:
  - governance/charter.md
- level: 2
  key: board_policy
  authority: binding
  paths:
  - governance/policies/*
  - governance/guardrails/*.py
  - org/schema.daslab.yaml
- level: 3
  key: dept_charter
  authority: add_only
  paths:
  - governance/CLAUDE.md
  - engineering/CLAUDE.md
  - product/CLAUDE.md
  - design/CLAUDE.md
  - marketing/CLAUDE.md
  - operations/CLAUDE.md
- level: 4
  key: role_charter
  authority: add_only
  paths:
  - config/org.yaml
- level: 5
  key: dept_runtime
  authority: add_only
  paths:
  - governance/AGENTS.md
  - engineering/AGENTS.md
  - product/AGENTS.md
  - design/AGENTS.md
  - marketing/AGENTS.md
  - operations/AGENTS.md
- level: 6
  key: umbrella_spec
  authority: add_only
  paths:
  - AGENTS.md
departments:
- key: governance
  title: Governance
  manager_role: chairman
- key: engineering
  title: Engineering
  manager_role: cto
- key: product
  title: Product
  manager_role: cpo
- key: design
  title: Design
  manager_role: cdo
- key: marketing
  title: Marketing
  manager_role: cmo
- key: operations
  title: Operations
  manager_role: coo
roles:
- key: board-member
  dept: governance
  title: Board Member
  model: sonnet
  effort: low
  reports_to: null
  rationale: Charter-guided reviews and votes — templated.
  charter:
    mission: 'As **Board Member** in the governance department, you own this slice of governance work:
      Charter-guided reviews and votes — templated. You work one ticket at a time (WIP = 1) from `board/tickets/`,
      per your dept charter and the board rules.'
    scope: |-
      - **Owns:** the governance tickets routed to this role (per `governance/policies/raci.md`), worked one at a time.
      - **Does NOT own:** decisions above your charter authority (escalate to the Board — see below), work outside governance, or another role's tickets. Cross-dept impact is flagged, not decided unilaterally.
    definition_of_done: '- Done means the decision, plan, or ADR you own is made and recorded (ADR / board
      minutes / approved queue), with the rationale and a law-check captured.'
    escalation: |-
      - Decision exceeds your charter authority → escalate to your manager.
      - Cross-dept impact → tag the relevant C-suite in a comment.
      - Stuck > 1 wave with no progress → mark blocked with a clear reason.
