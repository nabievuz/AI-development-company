version: 1

schema:
  required_fields: [id, content, project, provenance, trust_score, created_at]

trust_tiers:
  verified_pr: 1.0
  review_validated: 0.7
  cited_source: 0.5
  unverified_claim: 0.2

recall:
  min_trust: 0.3
  dedupe_similarity: 0.85

ranking:
  w_sim: 0.5
  w_recency: 0.3
  w_importance: 0.2
  half_life_days: 30

ttl_days:
  decision: 365
  fact: 180
  observation: 90
  default: 120

health:
  decay_per_bad: 0.05
