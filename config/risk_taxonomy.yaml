version: 1

risk_classes:
  low:
    criteria: "reversible, in-scope, non-security, doc/test/refactor"
    approval: auto
  medium:
    criteria: "reversible but impactful"
    approval: "review:manager"
  high:
    criteria: "hard to reverse OR multi-file core change"
    approval: "review:cxo"
  critical:
    criteria: "irreversible / security / NEW-GOAL / migration / governance"
    approval: "human:founder_or_board"

never_auto_approve:
  - new_goal
  - security_sensitive
  - schema_migration
  - gate5_deployment
  - governance_or_policy
  - permission_change
  - secret_change

matchers:
  new_goal:
    ticket_type: ["goal", "epic-root"]
  security_sensitive:
    labels: ["security", "auth", "secrets"]
    paths: ["**/auth/**", "**/secrets/**", "**/*secret*"]
  schema_migration:
    labels: ["migration", "schema"]
    paths: ["**/migrations/**", "**/schema/**", "arcrift/**/schema*", "**/alembic.ini"]
  gate5_deployment:
    labels: ["deploy", "gate-5"]
    stage: ["GATE-5"]
  governance_or_policy:
    paths: ["**/QONUN*", "**/CHARTER*", "**/ROUTING*", "**/CODEOWNERS", "governance/policies/**", "**/t7_rubric.yaml", "**/risk_taxonomy.yaml", "**/loop.yaml", "**/features.yaml", "**/registry.yaml"]
  permission_change:
    labels: ["permissions", "rbac"]
  secret_change:
    paths: ["**/.env*", "**/secrets/**"]
