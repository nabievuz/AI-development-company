[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daslab"
dynamic = ["version"]
description = "An operating system for a 32-agent AI software org — charters, a file-based board, a gated lifecycle, and Claude Code orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Akmaljon Nabiev" }]
keywords = [
    "ai-agents", "agent-orchestration", "autonomous-agents",
    "ai-agent-framework", "agentic-workflows", "claude", "anthropic",
    "claude-code", "software-organization", "multi-agent",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
control-plane = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]

[project.urls]
Homepage = "https://github.com/nabievuz/daslab"
Repository = "https://github.com/nabievuz/daslab"
Changelog = "https://github.com/nabievuz/daslab/blob/main/CHANGELOG.md"
Releases = "https://github.com/nabievuz/daslab/releases"
Issues = "https://github.com/nabievuz/daslab/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
packages = [
    "daslab_sdk",
    "governance.guardrails",
    "scripts.a2a_intake",
    "scripts.cache",
    "scripts.cost",
    "scripts.dgox",
    "tools.a2a",
    "tools.model_gateway",
    "tools.observability",
    "tools.sandbox",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"tools/browser/*.py" = ["E402"]
"governance/guardrails/*.py" = ["E402"]
"evals/**/fixtures/*.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
